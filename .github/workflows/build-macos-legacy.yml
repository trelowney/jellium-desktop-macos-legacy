name: build-macos-legacy

# Secondary macOS workflow that targets macOS 12 Monterey on Intel.
# Homebrew bottles target macOS 14+, so the libraries come prebuilt for macOS 12
# from the build-macos-libs workflow (MacPorts + ffmpeg + libplacebo), pinned
# below by tag and SHA-256. Apple Silicon Macs all run macOS 13+, so only
# x86_64 is built here.

# Pinned to CEF 150, the last Chromium release that still supports macOS 12
# (151 needs macOS 13). A version tag vYYYY.MM.DD[.N] publishes a release (the
# in-app updater installs it); a push to main replaces the "test-build"
# pre-release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  # pkg-config sees only MacPorts and our own source builds, never Homebrew.
  PKG_CONFIG_LIBDIR: /opt/local/lib/pkgconfig:/opt/local/share/pkgconfig
  # The app bundler copies dependencies from here instead of `brew --prefix`.
  JFN_DEPS_PREFIX: /opt/local
  # Output of the build-macos-libs workflow; update both after running it.
  LIBS_TAG: macos-libs-2026.11.07-42371107329
  LIBS_SHA256: c52fddbc4a087d9d452582f4385c1ab093b13084bf11955c0d559f079cf5c9d0

jobs:
  build:
    runs-on: macos-26-intel
    permissions:
      contents: write

    steps:
      # checkout runs git init, which warns without a default branch name.
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lock CEF 150 (last macOS 12 release)
        run: cargo update --manifest-path src/Cargo.toml -p cef --precise 150.2.1

      - name: Install build tools
        run: |
          # Some are already on the runner, and brew warns about those.
          for tool in meson ninja; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done

      # /opt/local (MacPorts) and ~/jellyfin-deps (ffmpeg, libplacebo), built for
      # macOS 12 by the build-macos-libs workflow.
      - name: Install prebuilt libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$HOME" = /Users/runner
          gh release download "$LIBS_TAG" -p 'macos-libs.tar.gz.*' -D "$RUNNER_TEMP/libs"
          cat "$RUNNER_TEMP"/libs/macos-libs.tar.gz.* > "$RUNNER_TEMP/libs.tar.gz"
          echo "$LIBS_SHA256  $RUNNER_TEMP/libs.tar.gz" | shasum -a 256 -c
          sudo mkdir -p /opt/local && sudo chown "$(whoami)" /opt/local
          tar -C / -xzf "$RUNNER_TEMP/libs.tar.gz"
          rm -rf "$RUNNER_TEMP/libs" "$RUNNER_TEMP/libs.tar.gz"

      # MoltenVK 1.4.2 (MacPorts since 2026-10-18) makes video flash in random
      # colors on Mac1-family GPUs such as the Intel Iris 6000. Use 1.4.1, the
      # same official KhronosGroup binary MacPorts shipped before, pinned by the
      # checksum from MacPorts' Portfile.
      - name: Use MoltenVK 1.4.1
        env:
          MVK_URL: https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-macos.tar
          MVK_SHA256: 5ea0c259df7ded9a275444820f09cced54d6e5a7c7a31d262de62a5cdb7e15cf
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mvk.tar" "$MVK_URL"
          echo "$MVK_SHA256  $RUNNER_TEMP/mvk.tar" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/mvk"
          tar -C "$RUNNER_TEMP/mvk" -xf "$RUNNER_TEMP/mvk.tar" MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
          lipo -thin x86_64 "$RUNNER_TEMP/mvk/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib" -output /opt/local/lib/libMoltenVK.dylib
          rm -rf "$RUNNER_TEMP/mvk" "$RUNNER_TEMP/mvk.tar"

      - name: Patch mpv for macOS 12 Swift compatibility
        run: |
          python3 -c "
          import pathlib, os
          # mpv's swift_compat.swift gates an NSLocking.withLock backport on
          # Swift 5.7, but withLock was only added to Foundation in Swift 5.8
          # (macOS 13). Enable the backport for Swift 5.7 too.
          p = pathlib.Path('third_party/mpv/osdep/mac/swift_compat.swift')
          t = p.read_text()
          t = t.replace('#if !swift(>=5.7)', '#if !swift(>=5.8)')
          p.write_text(t)

          # Pin mpv's Swift compile to the macOS 12 ABI so the resulting
          # libmpv only references Swift runtime symbols that exist on
          # Monterey (e.g. avoid __StaticArrayStorage which is macOS 13+).
          p = pathlib.Path('third_party/mpv/osdep/mac/meson.build')
          t = p.read_text()
          target = f'x86_64-apple-macos{os.environ[\"MACOSX_DEPLOYMENT_TARGET\"]}'
          marker = \"swift_flags = ['-c'\"
          inject = f\"swift_flags = ['-target', '{target}', '-c'\"
          if marker in t and inject not in t:
              t = t.replace(marker, inject)
              p.write_text(t)
          "

      - name: Patch mpv to build without warnings
        run: python3 dev/macos/patch_mpv_warnings.py

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}

      - name: Build app bundle
        env:
          # The in-app updater offers any release whose tag differs from this
          # one. Empty (update check off) for test builds and for pre-release
          # tags with a '-' suffix, which would otherwise offer the previous
          # stable release as an "update".
          JFN_RELEASE_TAG: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && github.ref_name || '' }}
        run: |
          export PKG_CONFIG_LIBDIR="$HOME/jellyfin-deps/lib/pkgconfig:$PKG_CONFIG_LIBDIR"
          export CMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}"
          export CMAKE_PREFIX_PATH="$HOME/jellyfin-deps;/opt/local"
          cargo xtask install --prefix build/output

      # No macOS 12 runner exists, so check what dyld on Monterey would check:
      # every Mach-O in the bundle must declare a minimum OS of 12.x or lower.
      - name: Verify every binary runs on macOS 12
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            v=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; exit}')
            printf '%-6s %s\n' "${v:-?}" "${f#build/output/}"
            if [ -z "$v" ] || [ "${v%%.*}" -gt 12 ]; then bad=1; echo "::error::${f#build/output/} needs macOS ${v:-unknown}"; fi
            otool -L "$f" | tail -n +2 | grep -E '/(usr/local|opt/homebrew)/' && { bad=1; echo "::error::${f#build/output/} links Homebrew"; }
          done < <(find "build/output/Jellium Desktop.app" -type f -print0)
          exit $bad

      - name: Create DMG
        run: |
          command -v create-dmg >/dev/null || brew install create-dmg
          APP_NAME="Jellium Desktop"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="JelliumDesktop-${VERSION}-macos-12-x86_64.dmg"
          mkdir -p dist

          create-dmg \
            --volname "Jellium Desktop v${VERSION}" \
            --no-internet-enable \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 125 150 \
            --app-drop-link 375 150 \
            "dist/${DMG_NAME}" "build/output/${APP_NAME}.app" || true

          if [ ! -f "dist/${DMG_NAME}" ]; then
            echo "DMG creation failed"
            exit 1
          fi
          ls -la "dist/${DMG_NAME}"

      # Runs the exact script the app uses to update itself against the DMG
      # just built: an "installed" copy of the app gets replaced by the one in
      # the DMG while a stand-in process plays the app that has to quit first.
      - name: Test the self-update
        run: |
          dmg=$(ls dist/*.dmg)
          dest="$RUNNER_TEMP/Applications/Jellium Desktop.app"
          work="$RUNNER_TEMP/jellium-update"
          log="$HOME/Library/Logs/Jellium Desktop/update.log"
          mkdir -p "$(dirname "$dest")"
          ditto "build/output/Jellium Desktop.app" "$dest"
          touch "$dest/Contents/old-version-marker"
          export JFN_UPDATE_TEST=1
          # Step 1 runs while the app is still open: download + copy only.
          bash src/jfn_cef/src/macos_update.sh prepare \
            "file://$PWD/$dmg" "$(stat -f%z "$dmg")" "$dest" "$work" \
            || { cat "$log"; exit 1; }
          test -e "$dest/Contents/old-version-marker"
          test -x "$dest.new/Contents/MacOS/jellium-desktop"
          # Step 2 after the app quit: a stand-in process plays the app.
          sleep 2 & pid=$!
          bash src/jfn_cef/src/macos_update.sh finish "$pid" "$dest" "$work" \
            || { cat "$log"; exit 1; }
          cat "$log"
          test ! -e "$dest/Contents/old-version-marker"
          test -x "$dest/Contents/MacOS/jellium-desktop"
          test ! -e "$dest.new"
          test ! -e "$work"
          diff -rq "build/output/Jellium Desktop.app" "$dest"
          rm -rf "$RUNNER_TEMP/Applications"

      # Release notes = only this version's CHANGELOG section. Tag
      # vYYYY.MM.DD[.N] -> heading "## YYYY-MM-DD[.N]"; a '-' suffix (test tag)
      # uses the section of the version it is a candidate for.
      - name: Extract release notes
        if: github.ref_type == 'tag'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ver="${ver%%-*}"
          header=$(echo "$ver" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+)/\1-\2-\3/')
          awk -v h="## $header" '$0==h {f=1; next} /^## / && f {exit} f {print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section '## $header'"
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/JelliumDesktop-*.dmg $pre \
            --title "Jellium Desktop $GITHUB_REF_NAME (macOS 12 Intel)" \
            --notes-file RELEASE_NOTES.md

      - name: Publish test pre-release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build dist/JelliumDesktop-*.dmg \
            --prerelease --target "$GITHUB_SHA" \
            --title "macOS 12 Intel test build (${{ steps.version.outputs.version }})" \
            --notes "Unsigned test build of the latest main for Intel Macs on macOS 12 Monterey (CEF 150). It does not update itself; install a numbered release for that. First launch: right-click the app, Open."

      - name: Build machine
        if: always()
        run: |
          {
            echo "### Build machine"
            echo "| | |"
            echo "|---|---|"
            echo "| CPU | $(sysctl -n machdep.cpu.brand_string) |"
            echo "| Cores | $(sysctl -n hw.physicalcpu) physical, $(sysctl -n hw.logicalcpu) logical |"
            echo "| RAM | $(( $(sysctl -n hw.memsize) / 1073741824 )) GB |"
            echo "| Disk | $(df -h / | awk 'NR==2 {print $2 " total, " $4 " free"}') |"
            echo "| macOS | $(sw_vers -productVersion) ($(uname -m)) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Delete the CEF cache after each run; the libraries come from a release.
  cleanup-cache:
    needs: build
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Delete CEF caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/caches" --paginate --jq '.actions_caches[] | select(.key | startswith("cef-")) | .id')
          for id in $ids; do gh api --method DELETE "repos/$REPO/actions/caches/$id" && echo "deleted cache $id"; done
