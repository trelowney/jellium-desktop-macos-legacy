name: build-macos-legacy

# Secondary macOS workflow that targets macOS 12 Monterey on Intel.
# The standard build-macos.yml workflow uses Homebrew bottles which target
# macOS 13+, so this workflow builds ffmpeg and libplacebo from source
# against the macOS 12 SDK. Apple Silicon Macs all run macOS 13+, so only
# x86_64 is built here.

# Pinned to CEF 150, the last Chromium release that still supports macOS 12
# (151 needs macOS 13). Until versioned releases exist, each run replaces the
# "test-build" pre-release.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  # pkg-config sees only MacPorts and our own source builds, never Homebrew.
  PKG_CONFIG_LIBDIR: /opt/local/lib/pkgconfig:/opt/local/share/pkgconfig
  # The app bundler copies dependencies from here instead of `brew --prefix`.
  JFN_DEPS_PREFIX: /opt/local

jobs:
  build:
    runs-on: macos-26-intel
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Lock CEF 150 (last macOS 12 release)
        run: cargo update --manifest-path src/Cargo.toml -p cef --precise 150.2.1

      - name: Install build tools
        run: brew install meson ninja nasm

      # Homebrew bottles on this runner are built for macOS 14/26 and refuse to
      # load on Monterey, so every library that ends up in the app bundle comes
      # from MacPorts, compiled from source with a macOS 12 deployment target.
      - name: Make /opt/local writable for the cache restore
        run: sudo mkdir -p /opt/local && sudo chown "$(whoami)" /opt/local

      - name: Cache MacPorts libraries
        id: ports-cache
        uses: actions/cache@v6
        with:
          path: /opt/local
          key: macports-x86_64-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-v1

      - name: Build libraries with MacPorts
        if: steps.ports-cache.outputs.cache-hit != 'true'
        run: |
          os=$(sw_vers -productVersion | cut -d. -f1)
          pkg=$(curl -fsSL https://api.github.com/repos/macports/macports-base/releases/latest \
            | jq -r --arg os "-$os-" '.assets[] | select(.name | endswith(".pkg") and contains($os)) | .browser_download_url')
          curl -fsSL -o /tmp/macports.pkg "$pkg"
          sudo installer -pkg /tmp/macports.pkg -target /
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          printf '%s\n' \
            "macosx_deployment_target ${MACOSX_DEPLOYMENT_TARGET}" \
            'buildfromsource always' \
            'build_arch x86_64' | sudo tee -a /opt/local/etc/macports/macports.conf
          echo '-x11 +quartz' | sudo tee -a /opt/local/etc/macports/variants.conf
          sudo port -N selfupdate
          sudo port -N install \
            libass lcms2 luajit zimg libjpeg-turbo \
            vulkan-loader vulkan-headers MoltenVK shaderc
          sudo port -N clean --all installed || true
          sudo chown -R "$(whoami)" /opt/local

      - name: Cache built deps (ffmpeg + libplacebo)
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ~/jellyfin-deps
          key: deps-x86_64-ffmpeg-n8.1-libplacebo-v7.360.1-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-macports-v3

      - name: Build ffmpeg from source
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n8.1 https://git.ffmpeg.org/ffmpeg.git /tmp/ffmpeg-src
          cd /tmp/ffmpeg-src
          ./configure \
            --prefix="$HOME/jellyfin-deps" \
            --enable-shared \
            --disable-static \
            --enable-gpl \
            --enable-version3 \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-xlib \
            --disable-libxcb \
            --disable-lzma \
            --disable-sdl2 \
            --extra-cflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -I/opt/local/include" \
            --extra-ldflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -L/opt/local/lib"
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Build libplacebo from source
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recursive --branch v7.360.1 https://code.videolan.org/videolan/libplacebo.git /tmp/libplacebo-src
          cd /tmp/libplacebo-src
          # Fix Python 3.14 compatibility: ElementTree constructor no longer
          # accepts an ElementTree object, only Element. Known upstream issue
          # in libplacebo v7.349.0 (utils_gen.py).
          python3 -c "
          import pathlib
          p = pathlib.Path('src/vulkan/utils_gen.py')
          t = p.read_text()
          t = t.replace('VkXML(ET.parse(xmlfile))', 'VkXML(ET.parse(xmlfile).getroot())')
          p.write_text(t)
          "
          meson setup build --prefix="$HOME/jellyfin-deps" \
            -Ddemos=false -Dtests=false -Dvulkan=enabled \
            -Dc_args="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            -Dcpp_args="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          ninja -C build
          ninja -C build install

      - name: Patch mpv for macOS 12 Swift compatibility
        run: |
          python3 -c "
          import pathlib, os
          # mpv's swift_compat.swift gates an NSLocking.withLock backport on
          # Swift 5.7, but withLock was only added to Foundation in Swift 5.8
          # (macOS 13). Enable the backport for Swift 5.7 too.
          p = pathlib.Path('third_party/mpv/osdep/mac/swift_compat.swift')
          t = p.read_text()
          t = t.replace('#if !swift(>=5.7)', '#if !swift(>=5.8)')
          p.write_text(t)

          # Pin mpv's Swift compile to the macOS 12 ABI so the resulting
          # libmpv only references Swift runtime symbols that exist on
          # Monterey (e.g. avoid __StaticArrayStorage which is macOS 13+).
          p = pathlib.Path('third_party/mpv/osdep/mac/meson.build')
          t = p.read_text()
          target = f'x86_64-apple-macos{os.environ[\"MACOSX_DEPLOYMENT_TARGET\"]}'
          marker = \"swift_flags = ['-c'\"
          inject = f\"swift_flags = ['-target', '{target}', '-c'\"
          if marker in t and inject not in t:
              t = t.replace(marker, inject)
              p.write_text(t)
          "

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}

      - name: Build app bundle
        run: |
          export PKG_CONFIG_LIBDIR="$HOME/jellyfin-deps/lib/pkgconfig:$PKG_CONFIG_LIBDIR"
          export CMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}"
          export CMAKE_PREFIX_PATH="$HOME/jellyfin-deps;/opt/local"
          cargo xtask install --prefix build/output

      # No macOS 12 runner exists, so check what dyld on Monterey would check:
      # every Mach-O in the bundle must declare a minimum OS of 12.x or lower.
      - name: Verify every binary runs on macOS 12
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            v=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; exit}')
            printf '%-6s %s\n' "${v:-?}" "${f#build/output/}"
            if [ -z "$v" ] || [ "${v%%.*}" -gt 12 ]; then bad=1; echo "::error::${f#build/output/} needs macOS ${v:-unknown}"; fi
            otool -L "$f" | tail -n +2 | grep -E '/(usr/local|opt/homebrew)/' && { bad=1; echo "::error::${f#build/output/} links Homebrew"; }
          done < <(find "build/output/Jellium Desktop.app" -type f -print0)
          exit $bad

      - name: Create DMG
        run: |
          brew install create-dmg
          APP_NAME="Jellium Desktop"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="JelliumDesktop-${VERSION}-macos-12-x86_64.dmg"
          mkdir -p dist

          create-dmg \
            --volname "Jellium Desktop v${VERSION}" \
            --no-internet-enable \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 125 150 \
            --app-drop-link 375 150 \
            "dist/${DMG_NAME}" "build/output/${APP_NAME}.app" || true

          if [ ! -f "dist/${DMG_NAME}" ]; then
            echo "DMG creation failed"
            exit 1
          fi
          ls -la "dist/${DMG_NAME}"

      - name: Publish test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build dist/JelliumDesktop-*.dmg \
            --prerelease --target "$GITHUB_SHA" \
            --title "macOS 12 Intel test build (${{ steps.version.outputs.version }})" \
            --notes "Experimental unsigned build for Intel Macs on macOS 12 Monterey (CEF 150). No RTX features on macOS. First launch: right-click the app, Open."

      - name: Build machine
        if: always()
        run: |
          {
            echo "### Build machine"
            echo "| | |"
            echo "|---|---|"
            echo "| CPU | $(sysctl -n machdep.cpu.brand_string) |"
            echo "| Cores | $(sysctl -n hw.physicalcpu) physical, $(sysctl -n hw.logicalcpu) logical |"
            echo "| RAM | $(( $(sysctl -n hw.memsize) / 1073741824 )) GB |"
            echo "| Disk | $(df -h / | awk 'NR==2 {print $2 " total, " $4 " free"}') |"
            echo "| macOS | $(sw_vers -productVersion) ($(uname -m)) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Delete the CEF cache after each run; keep the MacPorts and ffmpeg/libplacebo
  # caches, they are what makes later builds fast.
  cleanup-cache:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete CEF caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/caches" --paginate --jq '.actions_caches[] | select(.key | startswith("cef-")) | .id')
          for id in $ids; do gh api --method DELETE "repos/$REPO/actions/caches/$id" && echo "deleted cache $id"; done
