name: build-macos-legacy

# Secondary macOS workflow that targets macOS 12 Monterey on Intel.
# The standard build-macos.yml workflow uses Homebrew bottles which target
# macOS 13+, so this workflow builds ffmpeg and libplacebo from source
# against the macOS 12 SDK. Apple Silicon Macs all run macOS 13+, so only
# x86_64 is built here.

# Pinned to CEF 150, the last Chromium release that still supports macOS 12
# (151 needs macOS 13). A version tag vYYYY.MM.DD[.N] publishes a release (the
# in-app updater installs it); a push to main replaces the "test-build"
# pre-release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  # pkg-config sees only MacPorts and our own source builds, never Homebrew.
  PKG_CONFIG_LIBDIR: /opt/local/lib/pkgconfig:/opt/local/share/pkgconfig
  # The app bundler copies dependencies from here instead of `brew --prefix`.
  JFN_DEPS_PREFIX: /opt/local

jobs:
  build:
    runs-on: macos-26-intel
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lock CEF 150 (last macOS 12 release)
        run: cargo update --manifest-path src/Cargo.toml -p cef --precise 150.2.1

      - name: Install build tools
        run: brew install meson ninja nasm

      # Homebrew bottles on this runner are built for macOS 14/26 and refuse to
      # load on Monterey, so every library that ends up in the app bundle comes
      # from MacPorts, compiled from source with a macOS 12 deployment target.
      - name: Make /opt/local writable for the cache restore
        run: sudo mkdir -p /opt/local && sudo chown "$(whoami)" /opt/local

      # The first MacPorts build takes hours and may not finish inside the 6 h
      # job limit, so it is resumable: a cut-off build is cached as it is, and
      # the next run restores it and installs only the ports still missing.
      - name: Restore MacPorts libraries
        uses: actions/cache/restore@v6
        with:
          path: /opt/local
          key: macports-x86_64-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-v2
          restore-keys: macports-x86_64-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-v2-

      - name: Check MacPorts libraries
        id: ports-check
        run: test -f /opt/local/.ports-complete && echo "complete=true" >> "$GITHUB_OUTPUT" || true

      - name: Build libraries with MacPorts
        id: ports
        if: steps.ports-check.outputs.complete != 'true'
        timeout-minutes: 240
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          if [ ! -x /opt/local/bin/port ]; then
            os=$(sw_vers -productVersion | cut -d. -f1)
            pkg=$(curl -fsSL https://api.github.com/repos/macports/macports-base/releases/latest \
              | jq -r --arg os "-$os-" '.assets[] | select(.name | endswith(".pkg") and contains($os)) | .browser_download_url')
            curl -fsSL -o /tmp/macports.pkg "$pkg"
            sudo installer -pkg /tmp/macports.pkg -target /
            printf '%s\n' \
              "macosx_deployment_target ${MACOSX_DEPLOYMENT_TARGET}" \
              'buildfromsource always' \
              'build_arch x86_64' | sudo tee -a /opt/local/etc/macports/macports.conf
            # -yjit: shaderc's docs need asciidoctor -> ruby, and ruby's YJIT would
            # pull in a from-source Rust compiler (2+ hours). Nothing of it ships.
            echo '-x11 +quartz -yjit' | sudo tee -a /opt/local/etc/macports/variants.conf
          fi
          sudo port -N selfupdate
          sudo port -N install \
            libass lcms2 luajit zimg libjpeg-turbo \
            vulkan-loader vulkan-headers MoltenVK shaderc
          sudo touch /opt/local/.ports-complete

      - name: Save MacPorts libraries
        if: always() && (steps.ports.outcome == 'success' || steps.ports.outcome == 'failure' || steps.ports.outcome == 'cancelled')
        run: |
          # sudo resets PATH, so call port by its full path.
          sudo /opt/local/bin/port -N clean --all installed || true
          sudo rm -rf /opt/local/var/macports/build
          sudo chown -R "$(whoami)" /opt/local
          # Some ports install files the owner can't read (dbus-daemon-launch-helper
          # is 4750 root:messagebus); tar would fail on them and nothing would be saved.
          chmod -R u+rwX /opt/local
          unreadable=$(find /opt/local ! -perm -u=r | head -5)
          if [ -n "$unreadable" ]; then
            echo "::error::Files the cache can't read: $unreadable"
            exit 1
          fi

      - name: Upload MacPorts cache
        if: always() && (steps.ports.outcome == 'success' || steps.ports.outcome == 'failure' || steps.ports.outcome == 'cancelled')
        uses: actions/cache/save@v6
        with:
          path: /opt/local
          key: macports-x86_64-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop if MacPorts is not finished yet
        if: steps.ports.outcome != 'success' && steps.ports.outcome != 'skipped'
        run: |
          echo "::error::MacPorts did not finish within the time limit. The progress is cached; run the workflow again to continue."
          exit 1

      - name: Cache built deps (ffmpeg + libplacebo)
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ~/jellyfin-deps
          key: deps-x86_64-ffmpeg-n8.1-libplacebo-v7.360.1-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-macports-v3

      - name: Build ffmpeg from source
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n8.1 https://git.ffmpeg.org/ffmpeg.git /tmp/ffmpeg-src
          cd /tmp/ffmpeg-src
          ./configure \
            --prefix="$HOME/jellyfin-deps" \
            --enable-shared \
            --disable-static \
            --enable-gpl \
            --enable-version3 \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-xlib \
            --disable-libxcb \
            --disable-lzma \
            --disable-sdl2 \
            --extra-cflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -I/opt/local/include" \
            --extra-ldflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -L/opt/local/lib"
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Build libplacebo from source
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recursive --branch v7.360.1 https://code.videolan.org/videolan/libplacebo.git /tmp/libplacebo-src
          cd /tmp/libplacebo-src
          # Fix Python 3.14 compatibility: ElementTree constructor no longer
          # accepts an ElementTree object, only Element. Known upstream issue
          # in libplacebo v7.349.0 (utils_gen.py).
          python3 -c "
          import pathlib
          p = pathlib.Path('src/vulkan/utils_gen.py')
          t = p.read_text()
          t = t.replace('VkXML(ET.parse(xmlfile))', 'VkXML(ET.parse(xmlfile).getroot())')
          p.write_text(t)
          "
          meson setup build --prefix="$HOME/jellyfin-deps" \
            -Ddemos=false -Dtests=false -Dvulkan=enabled \
            -Dc_args="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            -Dcpp_args="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          ninja -C build
          ninja -C build install

      - name: Patch mpv for macOS 12 Swift compatibility
        run: |
          python3 -c "
          import pathlib, os
          # mpv's swift_compat.swift gates an NSLocking.withLock backport on
          # Swift 5.7, but withLock was only added to Foundation in Swift 5.8
          # (macOS 13). Enable the backport for Swift 5.7 too.
          p = pathlib.Path('third_party/mpv/osdep/mac/swift_compat.swift')
          t = p.read_text()
          t = t.replace('#if !swift(>=5.7)', '#if !swift(>=5.8)')
          p.write_text(t)

          # Pin mpv's Swift compile to the macOS 12 ABI so the resulting
          # libmpv only references Swift runtime symbols that exist on
          # Monterey (e.g. avoid __StaticArrayStorage which is macOS 13+).
          p = pathlib.Path('third_party/mpv/osdep/mac/meson.build')
          t = p.read_text()
          target = f'x86_64-apple-macos{os.environ[\"MACOSX_DEPLOYMENT_TARGET\"]}'
          marker = \"swift_flags = ['-c'\"
          inject = f\"swift_flags = ['-target', '{target}', '-c'\"
          if marker in t and inject not in t:
              t = t.replace(marker, inject)
              p.write_text(t)
          "

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}

      - name: Build app bundle
        env:
          # The in-app updater offers any release whose tag differs from this
          # one. Empty (update check off) for test builds and for pre-release
          # tags with a '-' suffix, which would otherwise offer the previous
          # stable release as an "update".
          JFN_RELEASE_TAG: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && github.ref_name || '' }}
        run: |
          export PKG_CONFIG_LIBDIR="$HOME/jellyfin-deps/lib/pkgconfig:$PKG_CONFIG_LIBDIR"
          export CMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}"
          export CMAKE_PREFIX_PATH="$HOME/jellyfin-deps;/opt/local"
          cargo xtask install --prefix build/output

      # No macOS 12 runner exists, so check what dyld on Monterey would check:
      # every Mach-O in the bundle must declare a minimum OS of 12.x or lower.
      - name: Verify every binary runs on macOS 12
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            v=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; exit}')
            printf '%-6s %s\n' "${v:-?}" "${f#build/output/}"
            if [ -z "$v" ] || [ "${v%%.*}" -gt 12 ]; then bad=1; echo "::error::${f#build/output/} needs macOS ${v:-unknown}"; fi
            otool -L "$f" | tail -n +2 | grep -E '/(usr/local|opt/homebrew)/' && { bad=1; echo "::error::${f#build/output/} links Homebrew"; }
          done < <(find "build/output/Jellium Desktop.app" -type f -print0)
          exit $bad

      - name: Create DMG
        run: |
          brew install create-dmg
          APP_NAME="Jellium Desktop"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="JelliumDesktop-${VERSION}-macos-12-x86_64.dmg"
          mkdir -p dist

          create-dmg \
            --volname "Jellium Desktop v${VERSION}" \
            --no-internet-enable \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 125 150 \
            --app-drop-link 375 150 \
            "dist/${DMG_NAME}" "build/output/${APP_NAME}.app" || true

          if [ ! -f "dist/${DMG_NAME}" ]; then
            echo "DMG creation failed"
            exit 1
          fi
          ls -la "dist/${DMG_NAME}"

      # Runs the exact script the app uses to update itself against the DMG
      # just built: an "installed" copy of the app gets replaced by the one in
      # the DMG while a stand-in process plays the app that has to quit first.
      - name: Test the self-update
        run: |
          dmg=$(ls dist/*.dmg)
          dest="$RUNNER_TEMP/Applications/Jellium Desktop.app"
          mkdir -p "$(dirname "$dest")"
          ditto "build/output/Jellium Desktop.app" "$dest"
          touch "$dest/Contents/old-version-marker"
          sleep 2 & pid=$!
          JFN_UPDATE_TEST=1 bash src/jfn_cef/src/macos_update.sh \
            "file://$PWD/$dmg" "$(stat -f%z "$dmg")" "$pid" "$dest" "test" \
            || { cat "$HOME/Library/Logs/Jellium Desktop/update.log"; exit 1; }
          cat "$HOME/Library/Logs/Jellium Desktop/update.log"
          test ! -e "$dest/Contents/old-version-marker"
          test -x "$dest/Contents/MacOS/jellium-desktop"
          test ! -e "$dest.new"
          diff -rq "build/output/Jellium Desktop.app" "$dest"
          rm -rf "$RUNNER_TEMP/Applications"

      # Release notes = only this version's CHANGELOG section. Tag
      # vYYYY.MM.DD[.N] -> heading "## YYYY-MM-DD[.N]"; a '-' suffix (test tag)
      # uses the section of the version it is a candidate for.
      - name: Extract release notes
        if: github.ref_type == 'tag'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ver="${ver%%-*}"
          header=$(echo "$ver" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+)/\1-\2-\3/')
          awk -v h="## $header" '$0==h {f=1; next} /^## / && f {exit} f {print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section '## $header'"
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/JelliumDesktop-*.dmg $pre \
            --title "Jellium Desktop $GITHUB_REF_NAME (macOS 12 Intel)" \
            --notes-file RELEASE_NOTES.md

      - name: Publish test pre-release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build dist/JelliumDesktop-*.dmg \
            --prerelease --target "$GITHUB_SHA" \
            --title "macOS 12 Intel test build (${{ steps.version.outputs.version }})" \
            --notes "Unsigned test build of the latest main for Intel Macs on macOS 12 Monterey (CEF 150). It does not update itself; install a numbered release for that. First launch: right-click the app, Open."

      - name: Build machine
        if: always()
        run: |
          {
            echo "### Build machine"
            echo "| | |"
            echo "|---|---|"
            echo "| CPU | $(sysctl -n machdep.cpu.brand_string) |"
            echo "| Cores | $(sysctl -n hw.physicalcpu) physical, $(sysctl -n hw.logicalcpu) logical |"
            echo "| RAM | $(( $(sysctl -n hw.memsize) / 1073741824 )) GB |"
            echo "| Disk | $(df -h / | awk 'NR==2 {print $2 " total, " $4 " free"}') |"
            echo "| macOS | $(sw_vers -productVersion) ($(uname -m)) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Delete the CEF cache after each run; keep the MacPorts and ffmpeg/libplacebo
  # caches, they are what makes later builds fast.
  cleanup-cache:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete CEF caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/caches" --paginate --jq '.actions_caches[] | select(.key | startswith("cef-")) | .id')
          for id in $ids; do gh api --method DELETE "repos/$REPO/actions/caches/$id" && echo "deleted cache $id"; done
