# Runs the smoke test (dev/macos/smoke_test.sh) against an already published
# release, in a few minutes instead of a full build: the app must start and
# play a clip over HTTPS. The release workflow runs the same test on every
# build before publishing.
name: smoke-macos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test, e.g. v2026.11.07.3
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-26-intel
    steps:
      # checkout runs git init, which warns without a default branch name.
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" -p '*.dmg' -D "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP"/dmg/*.dmg >/dev/null
          cp -R "$RUNNER_TEMP/mnt/Jellium Desktop.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/mnt" >/dev/null

      - name: Smoke test
        run: >-
          dev/macos/smoke_test.sh "$RUNNER_TEMP/Jellium Desktop.app"
          "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/dev/macos/smoke.mp4"
